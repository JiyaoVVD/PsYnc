syntax = "proto3";

package game.network.types;

message Value{
	oneof kind{
		int64 int_val = 1;
		int64 fixed_val = 2;
		double float_val = 3;
		bool bool_val = 4;
		string str_val = 5;
		bytes bytes_val = 6;
		List list_val = 7;
		Dict dict_val = 8;
	}
}

message List{
	repeated Value items = 1;
}

message StrDict{
	map<string, Value> fields = 1;
}

message IntDict{
	map<int64, Value> fields = 1;
}

message BoolDict{
	map<bool, Value> fields = 1;
}

message Dict{
	oneof dict {
		StrDict str_dict = 1;
		IntDict int_dict = 2;
		BoolDict bool_dict = 3;
	}
}