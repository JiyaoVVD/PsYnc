syntax = "proto3";

package game.network.types;


enum ValueType{
	Int = 0;
	Fixed = 1;
	Float = 2;
	Bool = 3;
	Str = 4;
	Bytes = 5;
	List = 6;
	Dict = 7;
}


message Value{
	oneof kind{
		int64 int_val = 1;
		int64 fixed_val = 2;
		double float_val = 3;
		bool bool_val = 4;
		string str_val = 5;
		bytes bytes_val = 6;
		ListValue list_val = 7;
		DictValue dict_val = 8;
	}
}

message KVPair{
	Value key = 1;
	Value value = 2;
}

message ListValue{
	repeated Value items = 1;
}

message DictValue{
	repeated KVPair items = 1;
}