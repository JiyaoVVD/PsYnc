syntax = "proto3";

package game.network.ssproperty;

import "net/protos/types.proto";

message PropertyField{
	oneof kind{
		int64 int_key = 1;
		string str_key = 2;
		bool bool_key = 3;
		int64 index_key = 4;
	}
}

message PropertyChange{
	.game.network.types.Value value = 1;
	repeated PropertyField path = 2;
}

message PropertyPatch{
	int64 mailbox = 1;
	repeated PropertyChange changes = 2;
}